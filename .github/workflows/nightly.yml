name: Nightly (slow + bounds-check)

# The default test job runs `pytest -m "not slow"` for turnaround time.
# Slow numerical campaigns and explicit book/bounds/determinism gates run here.

on:
  schedule:
    # 04:17 UTC daily (off the hour: GitHub schedules are busiest then).
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  slow:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: slow
            pytest-args: '-m slow'
          - suite: book
            pytest-args: '-m book'
          - suite: bounds-check
            pytest-args: 'tests/test_determinism.py::test_panel_has_no_out_of_bounds_reads'
          - suite: determinism
            pytest-args: 'tests/test_determinism.py::test_panel_is_deterministic_across_processes'
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      ATOMX_TEST_DETERMINISM_PANEL: full
      ATOMX_TEST_DETERMINISM_REPEATS: "12"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libcairo2-dev libpango1.0-dev
      - name: Install dependencies
        run: uv sync --locked --all-extras --python 3.13
      - name: Run ${{ matrix.suite }} gate
        run: uv run --python 3.13 pytest ${{ matrix.pytest-args }} -q
