name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ruff
        # Pinned: the lint gate must not change meaning because a new ruff
        # release enabled a rule.  Bump deliberately, together with the fixes.
        run: pip install ruff==0.15.6
      - name: Run ruff
        # --no-cache: with an incremental cache and a path list containing a
        # heavily gitignored directory, ruff 0.15.6 was observed reporting
        # "All checks passed!" (exit 0) without checking any file.
        run: ruff check --no-cache src tests scripts benchmarks
      - name: Check documentation links
        run: python scripts/check_documentation.py
      - name: Check project navigation is current
        run: python scripts/build_project_index.py --check
