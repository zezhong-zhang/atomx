name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Local development runs 3.13 (and the nondeterministic-NaN / bounds
        # defects reproduced there), so the floor alone is not enough.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libcairo2-dev libpango1.0-dev
      - name: Install dependencies
        # --locked: CI must test the committed uv.lock, not a silent re-resolve.
        # --all-extras: viz/notebook/manim extras are required by the test suite.
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - name: Show pytest interpreter
        run: uv run --python ${{ matrix.python-version }} python -c "import sys; print(sys.version); print(sys.executable)"
      - name: Run pytest
        env:
          # Serial math kernels for CI determinism. Hosted runners land on
          # heterogeneous Azure hardware, and threaded OpenBLAS (bundled in
          # the numpy/scipy wheels) intermittently produced non-finite
          # intermediates there: HYP-1530 forensics showed byte-identical
          # numerical code passing and NaN-failing on the same runner image
          # within hours (three consecutive runs failed at three unrelated
          # numerical sites). Serial BLAS removes the thread-scheduling
          # variance vector at a modest runtime cost.
          OPENBLAS_NUM_THREADS: "1"
          NUMBA_NUM_THREADS: "1"
        run: uv run --python ${{ matrix.python-version }} pytest -m "not slow" -q
      - name: Determinism gate (fresh processes, bit-identical results)
        env:
          ATOMX_TEST_DETERMINISM_PANEL: full
          ATOMX_TEST_DETERMINISM_REPEATS: "4"
        run: uv run --python ${{ matrix.python-version }} pytest tests/test_determinism.py::test_panel_is_deterministic_across_processes -q
