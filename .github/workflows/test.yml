name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libcairo2-dev libpango1.0-dev
      - name: Install dependencies
        run: uv sync --extra dev --python 3.10
      - name: Show pytest interpreter
        run: uv run --python 3.10 python -c "import sys; print(sys.version); print(sys.executable)"
      - name: Run pytest
        run: uv run --python 3.10 pytest -m "not slow" -q
