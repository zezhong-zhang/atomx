name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libcairo2-dev libpango1.0-dev
      - name: Install dependencies
        run: uv sync --extra dev --python 3.10
      - name: Show pytest interpreter
        run: uv run --python 3.10 python -c "import sys; print(sys.version); print(sys.executable)"
      - name: Run pytest
        env:
          # Serial math kernels for CI determinism. Hosted runners land on
          # heterogeneous Azure hardware, and threaded OpenBLAS (bundled in
          # the numpy/scipy wheels) intermittently produced non-finite
          # intermediates there: HYP-1530 forensics showed byte-identical
          # numerical code passing and NaN-failing on the same runner image
          # within hours (three consecutive runs failed at three unrelated
          # numerical sites). Serial BLAS removes the thread-scheduling
          # variance vector at a modest runtime cost.
          OPENBLAS_NUM_THREADS: "1"
          NUMBA_NUM_THREADS: "1"
        run: uv run --python 3.10 pytest -m "not slow" -q
