<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Atomx · 原子谱学验证图谱</title>
<style>
:root{--bg:#0b111a;--panel:#121d2c;--line:#293a50;--text:#e4edf8;--muted:#9aacbf;--blue:#63bcff;--green:#60cbb0;--amber:#f4b76f;--rose:#ff8691}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:32px}h1{font-size:clamp(28px,4vw,46px);margin:6px 0 12px;letter-spacing:-1px}h2{margin:0;font-size:23px}h3{font-size:17px;margin:14px 0 8px}p{margin:8px 0}.muted,small{color:var(--muted)}.eyebrow{color:var(--blue);font:12px monospace;letter-spacing:2px}.top{display:flex;justify-content:space-between;gap:24px;align-items:start}.badge{padding:5px 10px;border:1px solid var(--line);border-radius:30px;font-size:12px;white-space:nowrap}.warning{background:#33251c;color:#ffd49f;border-left:3px solid var(--amber);padding:12px 16px;margin:22px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.stat{padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.stat strong{display:block;font-size:27px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:18px 0}input,select,button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 12px}input{min-width:230px}button,select{cursor:pointer}button:hover{border-color:var(--blue)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.periodic-wrap{overflow:auto}.periodic{display:grid;grid-template-columns:repeat(18,minmax(48px,1fr));grid-template-rows:repeat(10,74px);gap:6px;min-width:960px}.element{position:relative;padding:4px 6px;text-align:left;border-radius:7px;transition:background .15s}.element .number{font:11px monospace;color:var(--muted)}.element .symbol{display:block;font-weight:700;font-size:23px;line-height:1.15}.element small{font-size:10px}.element.reference{background:#162d3d;border-color:#27516a}.element.compared{background:#2e2925;border-color:#8b6541}.element.active{outline:2px solid var(--blue);background:#1f4764}.element.dim{opacity:.25}.legend{display:flex;gap:20px;color:var(--muted);font-size:12px;flex-wrap:wrap;margin:12px 0 24px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#27516a}.dot.amber{background:var(--amber)}.dot.gray{background:var(--line)}.detail{border:1px solid var(--line);border-radius:14px;padding:24px;background:var(--panel)}.detail-head{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}.tabs{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}.tab.active{background:#21455e;border-color:var(--blue)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:13px}th{text-align:left;color:var(--muted);font-weight:500;background:#172639}td,th{padding:9px 12px;border-bottom:1px solid var(--line)}td.wrap{white-space:normal;min-width:160px;max-width:420px}.numeric{font-variant-numeric:tabular-nums}.bad{color:var(--rose)}.good{color:var(--green)}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}.model{margin:16px 0;padding:16px;border:1px solid var(--line);border-radius:10px}.chart{width:100%;height:180px}.source{overflow-wrap:anywhere;white-space:normal;font:12px/1.7 monospace;color:var(--muted)}a{color:var(--blue)}details{padding:12px 0}summary{cursor:pointer}footer{margin:24px 0;color:var(--muted);font-size:12px}.empty{padding:25px;color:var(--muted)}@media(max-width:700px){main{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}.top{display:block}.detail{padding:16px}.stat strong{font-size:23px}}
[hidden]{display:none!important}
</style></head><body><main>
<div class="top"><div><div class="eyebrow">ATOMX / ATOMIC SPECTROSCOPY</div><h1>从周期表，追到每一条谱线。</h1><p class="muted">NIST 参考档案 × 计算结果 × 精度证据</p></div><span class="badge">原子级验证 · 持续迭代</span></div>
<div class="warning">当前尚未达到最高水准。数值收敛、物理空间收敛、实验精度分别判断；参考覆盖不等于计算通过。</div>
<div class="stats" id="stats"></div>
<div class="toolbar"><input id="search" aria-label="搜索元素" placeholder="搜索元素：Yb、Ne 或原子序数"><select id="coverage" aria-label="参考覆盖筛选"><option value="all">全部 118 个元素</option><option value="reference">有能级 / 谱线参考</option><option value="compared">有历史唯一能级比较</option></select><span class="muted" id="snapshot"></span></div>
<div class="periodic-wrap"><div class="periodic" id="periodic" aria-label="元素周期表"></div></div>
<div class="legend"><span><i class="dot"></i>有参考记录</span><span><i class="dot amber"></i>有历史唯一能级比较，待当前源码认证</span><span><i class="dot gray"></i>无本地能级 / 谱线记录</span><span>镧系：La–Lu；锕系：Ac–Lr</span></div>
<section class="detail" id="detail"><div class="detail-head"><div><h2 id="title">正在读取档案…</h2><p class="muted" id="ion-info"></p></div><select id="ion" aria-label="离子电荷"></select></div>
<div class="tabs" id="tabs"><button class="tab active" data-tab="models">新计算对照</button><button class="tab" data-tab="levels">参考能级</button><button class="tab" data-tab="lines">参考谱线</button><button class="tab" data-tab="history">历史计算</button><button class="tab" data-tab="ionization">电离能</button><button class="tab" data-tab="sources">来源与边界</button></div>
<div class="toolbar" id="row-controls"><input id="row-search" aria-label="筛选记录" placeholder="筛选组态、项、状态或参考编号"><select id="kind" aria-label="记录类型筛选"><option value="all">全部记录</option><option value="evaluated">评估参考</option><option value="observed">实测波长</option><option value="unique_level_comparison">历史唯一能级比较</option></select><button id="download">下载当前完整表 JSON</button></div>
<div id="content"></div><div class="pager" id="pager"><button id="previous">上一页</button><span id="page-label"></span><button id="next">下一页</button></div></section>
<details><summary>档案范围、数据质量与误差口径</summary><div id="method"></div></details>
<footer>参考单位：能级 cm⁻¹、波长 nm、电离能 eV、跃迁率 s⁻¹。Aki 是跃迁概率，不等于实验发射强度。理论 / 半经验参考与实测参考分别保留。<br><a href="https://physics.nist.gov/PhysRefData/ASD/Html/levelshelp.html" target="_blank" rel="noopener">NIST 能级说明</a> · <a href="https://physics.nist.gov/PhysRefData/ASD/" target="_blank" rel="noopener">NIST ASD</a></footer>
</main><script>
'use strict';
const $=s=>document.querySelector(s),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=v=>v===null||v===undefined||v===''?'—':Number.isFinite(Number(v))?Number(v).toLocaleString('en-US',{maximumFractionDigits:8}):esc(v);
const names={ground_reference:'共同基态零点',configuration_average_only:'仅组态平均，不作精细能级评分',unique_level_comparison:'历史唯一能级比较',waiting_for_calculation:'等待计算',theoretical_reference:'理论参考',semiempirical_reference:'半经验参考',unresolved_same_configuration:'同组态多态未分辨',no_numeric_energy:'缺少数值能量',calculation_failed:'计算失败',basis_limited:'基组限制',evaluated:'评估值',theoretical:'理论值',semiempirical:'半经验值',offset_reference:'非共同零点',ionization_limit:'电离极限',unclassified_configuration:'组态未分类',no_evaluated_zero_reference:'缺少评估零点',inverted_configuration_order:'组态排序异常'};
let index,element,ion,payload={},tab='models',page=0,request=0;const cache=new Map(),size=75;
function table(rows,columns){return `<div class="table-wrap"><table><thead><tr>${columns.map(c=>`<th>${esc(c[0])}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${columns.map(c=>`<td class="${c[2]||'numeric'}">${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function text(key){return r=>esc(r[key])}function num(key){return r=>fmt(r[key])}
function drawTable(){const query=$('#row-search').value.toLowerCase(),kind=$('#kind').value;let rows=payload[tab]||[];if(tab==='ionization')rows=ion.ionization||[];
rows=rows.filter(r=>(!query||JSON.stringify(r).toLowerCase().includes(query))&&(kind==='all'||r.energy_kind===kind||r.status===kind||(kind==='observed'&&r.observed_nm!==null&&r.observed_nm!==undefined)));
page=Math.min(page,Math.max(0,Math.ceil(rows.length/size)-1));const visible=rows.slice(page*size,(page+1)*size);
const columns={levels:[['组态',text('configuration_nist'),'wrap'],['项',text('term')],['J',text('j_text')],['能级 cm⁻¹',num('energy_cm1')],['不确定度 cm⁻¹',num('uncertainty_cm1')],['类别',r=>esc(names[r.energy_kind]||r.energy_kind)],['参考',text('reference')],['Level ID',text('level_id')]],
lines:[['下态',r=>esc(`${r.lower_configuration} ${r.lower_term} J=${r.lower_j}`),'wrap'],['上态',r=>esc(`${r.upper_configuration} ${r.upper_term} J=${r.upper_j}`),'wrap'],['实测 nm',num('observed_nm')],['实测 σ nm',num('observed_unc_nm')],['Ritz nm',num('ritz_nm')],['Ritz σ nm',num('ritz_unc_nm')],['介质',text('medium')],['Aki s⁻¹',num('aki_s1')],['精度码',text('aki_accuracy')],['多极',text('transition_type')],['谱线参考',text('line_reference')],['跃迁率参考',text('tp_reference')]],
history:[['组态',text('configuration'),'wrap'],['项 / J',r=>esc(`${r.term} / ${r.j}`)],['计算 cm⁻¹',num('calculated_cm1')],['参考 cm⁻¹',num('energy_cm1')],['可评分差 cm⁻¹',num('scored_residual_cm1')],['状态',r=>esc(names[r.status]||r.status),'wrap'],['参考类别',text('reference_kind')],['同位素 A',text('isotope_a')],['历史模型',text('model'),'wrap']],
ionization:[['谱种',text('spectrum')],['基态',text('ground_configuration')],['IE eV',num('ionization_eV')],['σ eV',num('uncertainty_eV')],['类别',r=>esc(names[r.ionization_kind]||r.ionization_kind)],['原始标注',text('ionization_raw')],['参考',text('reference')]]};
$('#content').innerHTML=rows.length?table(visible,columns[tab]):'<p class="empty">当前离子 / 筛选没有相应记录；没有数据不表示误差为零。</p>';
$('#pager').hidden=false;$('#page-label').textContent=`${rows.length.toLocaleString()} 条 · ${rows.length?page+1:0} / ${Math.ceil(rows.length/size)} 页`;
$('#previous').disabled=page===0;$('#next').disabled=(page+1)*size>=rows.length;
}
function models(){const models=payload.models||[];if(!models.length){$('#content').innerHTML='<p class="empty">当前谱种没有接入本页面的近期相关计算。可查看参考档案和历史计算；历史缓存不代表当前版本认证。</p>';return}
$('#content').innerHTML=models.map(m=>{const rs=m.rows;const max=Math.max(1,...rs.map(r=>Math.abs(r.error_percent||0)));const bars=rs.map((r,i)=>{const y=12+i*40,x=330+((r.error_percent||0)<0?-Math.abs(r.error_percent)/max*250:0),w=Math.abs(r.error_percent||0)/max*250;return `<text x="10" y="${y+17}" fill="#9aacbf" font-size="12">${esc(r.configuration)} · 2J=${r.two_j}</text><rect x="${x}" y="${y}" width="${w}" height="22" rx="3" fill="${r.goal_pass?'#60cbb0':'#ff8691'}"/><text x="${r.error_percent>=0?340+w:340}" y="${y+16}" fill="#e4edf8" font-size="12">${fmt(r.error_percent)}%</text>`}).join('');return `<div class="model"><h3>${esc(m.title)}</h3><p class="muted">${esc(m.scope)}</p><p>原实验目标：${Math.round(rs[0].relative_goal*100)}%；${rs.filter(r=>r.goal_pass).length}/${rs.length} 通过。此门限不代表最高水平。</p><svg class="chart" viewBox="0 0 780 180" role="img" aria-label="计算与本地 ASD 激发能的相对误差"><line x1="330" y1="0" x2="330" y2="175" stroke="#4a5b6e"/>${bars}</svg>${table(rs,[['组态 / 2J',r=>esc(`${r.configuration} / ${r.two_j}`)],['计算 cm⁻¹',num('calculated_cm1')],['本地 ASD cm⁻¹',num('reference_cm1')],['差 cm⁻¹',num('error_cm1')],['差 %',num('error_percent')],['ASD σ cm⁻¹',num('uncertainty_cm1')],['ASD−Handbook',num('asd_minus_handbook_cm1')],['原目标',r=>r.matching!=='unique_nominal_branch'?'未匹配':`<span class="${r.goal_pass?'good':'bad'}">${r.goal_pass?'通过':'未通过'}</span>`]])}<p class="source">保存运行：${esc(m.saved_run)}<br>证据 SHA256：${esc(m.sha256)}<br>匹配为名义参考连接分支；尚未认证大空间归一化态的组态权重和 dressed 跃迁率。</p></div>`}).join('')}
function sources(){const ss=payload.sources||[];$('#content').innerHTML=`<p>${esc(index.scope)}</p><p>实测与 Ritz 保留各自的不确定度和介质。Ritz 是由能级推导的量，不算独立实测。历史缓存保留其原模型；组态平均不冒充每一条精细能级。</p><h3>此离子原始来源</h3>${ss.map(s=>`<p class="source"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.kind)} · 原始数据</a><br>SHA256 ${esc(s.sha256)}<br>${s.declared_rows??'—'} 条声明记录；${esc(s.error||'无记录的下载错误')}</p>`).join('')||'<p>无此离子的能级 / 谱线来源文件。</p>'}<p class="source">档案快照 SHA256：${esc(index.provenance.snapshot_sha256)}<br>历史 CSV SHA256：${esc(index.provenance.history_sha256)}</p>`}
function draw(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#pager').hidden=tab==='models'||tab==='sources';$('#row-controls').hidden=tab==='models'||tab==='sources';if(tab==='models')models();else if(tab==='sources')sources();else drawTable()}
async function selectIon(){const serial=++request;ion=element.ions.find(i=>i.charge===Number($('#ion').value));$('#ion-info').textContent=`${ion.label} · 电荷 +${ion.charge} · ${ion.level_rows} 条能级 / ${ion.line_rows} 条谱线 / ${ion.observed_wavelengths} 条实测波长`;
payload={};$('#content').innerHTML='<p class="empty">正在读取所选离子…</p>';try{if(ion.asset){if(!cache.has(ion.asset)){const res=await fetch(ion.asset);if(!res.ok)throw Error('HTTP '+res.status);const bytes=await res.arrayBuffer();const header=new Uint8Array(bytes,0,Math.min(2,bytes.byteLength));const decoded=header[0]===31&&header[1]===139?await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).json():JSON.parse(new TextDecoder().decode(bytes));cache.set(ion.asset,decoded);if(cache.size>6)cache.delete(cache.keys().next().value)}if(serial!==request)return;payload=cache.get(ion.asset)}page=0;draw();location.hash=`${element.symbol}:${ion.charge}:${tab}`}catch(e){if(serial===request)$('#content').textContent='数据读取失败：'+e.message}}
function selectElement(z,charge){element=index.elements.find(e=>e.z===z);document.querySelectorAll('.element').forEach(b=>b.classList.toggle('active',Number(b.dataset.z)===z));$('#title').textContent=`${element.symbol} · Z = ${z}`;$('#ion').innerHTML=element.ions.map(i=>`<option value="${i.charge}">${esc(i.label)} · +${i.charge}${i.level_rows||i.line_rows?' · 有参考':''}</option>`).join('');$('#ion').value=charge!==undefined&&element.ions.some(i=>i.charge===charge)?charge:0;selectIon()}
function filterElements(){const q=$('#search').value.trim().toLowerCase(),filter=$('#coverage').value;document.querySelectorAll('.element').forEach(b=>{const e=index.elements[Number(b.dataset.z)-1];b.classList.toggle('dim',(!(e.symbol.toLowerCase().includes(q)||String(e.z)===q))||(filter==='reference'&&!e.levels&&!e.lines)||(filter==='compared'&&!e.unique_history))})}
$('#search').oninput=filterElements;$('#coverage').onchange=filterElements;$('#ion').onchange=selectIon;$('#tabs').onclick=e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;page=0;draw();location.hash=`${element.symbol}:${ion.charge}:${tab}`}};$('#row-search').oninput=()=>{page=0;draw()};$('#kind').onchange=()=>{page=0;draw()};$('#previous').onclick=()=>{page--;draw()};$('#next').onclick=()=>{page++;draw()};$('#download').onclick=()=>{const blob=new Blob([JSON.stringify(tab==='ionization'?ion.ionization:payload[tab]||[],null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`atomx-${element.symbol}-q${ion.charge}-${tab}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
fetch('index.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{index=d;$('#stats').innerHTML=[['参考能级',d.counts.levels],['参考谱线',d.counts.lines],['电离能记录',d.counts.nist_ionization],['历史唯一能级比较',d.history_statuses.unique_level_comparison||0]].map(([label,n])=>`<div class="stat"><strong>${n.toLocaleString()}</strong><span class="muted">${label}</span></div>`).join('');$('#snapshot').textContent='本地快照 · '+d.metadata.built_utc.slice(0,10);$('#periodic').innerHTML=d.elements.map(e=>`<button class="element ${e.levels||e.lines?'reference':''} ${e.unique_history?'compared':''}" style="grid-row:${e.position[0]};grid-column:${e.position[1]}" data-z="${e.z}" aria-label="${e.symbol} 原子序数 ${e.z}，${e.levels} 条能级"><span class="number">${e.z}</span><span class="symbol">${e.symbol}</span><small>${e.levels?e.levels.toLocaleString()+' 能级':'待参考'}</small></button>`).join('');$('#periodic').onclick=e=>{const b=e.target.closest('button');if(b)selectElement(Number(b.dataset.z))};$('#method').innerHTML=`<p>${esc(d.metadata.source)}，保存于 ${esc(d.metadata.built_utc)}；不是实时最新 ASD。每个离子可检查原始 URL 与 SHA256。</p><p>本地源表行数差异：${d.source_count_discrepancies.length} 项，均保留，未以“完整档案”掩盖。</p>${table(Object.entries(d.history_statuses).map(([status,count])=>({status,count})),[['历史状态',r=>esc(names[r.status]||r.status),'wrap'],['记录数',num('count')]])}<p>空字段不是零；缺失、模糊匹配、失败以及理论参考保留在覆盖分母中。最高水平要求独立同模型对照、物理空间收敛和可复现误差预算，本页面尚无元素获得该认证。</p>`;const parts=location.hash.slice(1).split(':');const selected=d.elements.find(e=>e.symbol===parts[0]);if(['models','levels','lines','history','ionization','sources'].includes(parts[2]))tab=parts[2];selectElement(selected?.z||70,selected?Number(parts[1]||0):1)}).catch(e=>{$('#title').textContent='档案加载失败';$('#content').textContent=e.message});
</script></body></html>
