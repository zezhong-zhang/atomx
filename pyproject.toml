[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atomx"
version = "0.1.0"
description = "High-performance relativistic atomic structure calculations using B-spline Dirac-Fock"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.58",
    "h5py>=3.0",
    "plotly>=6.7.0",
    "manim>=0.19.1",
    "matplotlib>=3.10.8",
    "nbformat>=5.10.4",
    "ipython>=8.39.0",
    "ipykernel>=7.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-benchmark", "sympy>=1.12", "pre-commit>=3.0"]
units = ["pint>=0.21"]
viz = ["matplotlib>=3.7", "plotly>=5.0"]
viz-manim = ["manim>=0.18"]
viz-all = ["matplotlib>=3.7", "plotly>=5.0", "manim>=0.18"]
all = [
    "matplotlib>=3.7", "plotly>=5.0", "manim>=0.18",
    "pint>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atomx"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["T201"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that run expensive atomic-structure calculations",
    "fac_parity: frozen atomx SELF-regression snapshot (compares atomx to its own frozen atomx_* columns; does NOT assert the fac_* columns — see review doc §V1)",
]

[tool.atomx.performance_dashboard]
output = "benchmarks/PERFORMANCE.md"
check_command = "python scripts/perf_dashboard.py --check"
affected_paths = [
    "benchmarks/*.csv",
    "scripts/perf_dashboard.py",
]
