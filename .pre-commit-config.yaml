# Pre-commit hooks.  Install once with `pre-commit install`.  The ruff hook
# uses the same rule selection as CI (.github/workflows/lint.yml) so a local
# pass implies a green lint job; previously the only hook was the performance
# dashboard, and it was not installed.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
        args: ["--no-cache", "--fix"]
        files: ^(src|tests|scripts|benchmarks)/.*\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]

  - repo: local
    hooks:
      - id: atomx-performance-dashboard
        name: Refresh benchmark performance dashboard
        entry: python scripts/perf_dashboard.py --check
        language: system
        pass_filenames: false
        files: ^(benchmarks/.*\.csv|scripts/perf_dashboard\.py)$
