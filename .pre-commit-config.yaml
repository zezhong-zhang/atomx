# Pre-commit hooks.  Install once with `pre-commit install`.  The ruff hook
# uses the same rule selection as CI (.github/workflows/lint.yml) so a local
# pass implies a green lint job; previously the only hook was the performance
# dashboard, and it was not installed. The dashboard command is now retired.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
        args: ["--no-cache", "--fix"]
        files: ^(src|tests|scripts|benchmarks)/.*\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        # Preserve byte identities of delivered evidence and generated reports.
        exclude: &delivered_evidence '^docs/([^/]+_20[0-9]{2}_[0-9]{2}_[0-9]{2}/|archive/)'
      - id: trailing-whitespace
        exclude: *delivered_evidence
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
        # Requested replay bundles; component files and manifests remain checked.
        exclude: '^(docs/rare_earth_yb_spectrum_2026_10_08/Yb谱线计算与实验对照_复现数据\.zip|docs/spectroscopy_science_story_2026_10_06/delivery/Atomx_谱学研究体系_案例与代码\.zip)$'

  - repo: local
    hooks:
      - id: project-index
        name: Rebuild agent project index from staged files
        entry: python3 scripts/build_project_index.py --staged --stage
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
