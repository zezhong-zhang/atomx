<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#50748e"/></marker>
  </defs>
  <rect width="1200" height="360" rx="16" fill="#f4f7fa"/>
  <g font-family="Noto Sans CJK SC, sans-serif" text-anchor="middle">
    <text x="600" y="38" font-size="22" font-weight="bold" fill="#153d57">由研究目标到可复核的科学判断</text>
    <g fill="#fff" stroke="#b8cbd7" stroke-width="2">
      <rect x="30" y="80" width="200" height="100" rx="12"/>
      <rect x="265" y="80" width="200" height="100" rx="12"/>
      <rect x="500" y="80" width="200" height="100" rx="12"/>
      <rect x="735" y="80" width="200" height="100" rx="12"/>
      <rect x="970" y="80" width="200" height="100" rx="12"/>
    </g>
    <g fill="#153d57" font-size="20" font-weight="bold">
      <text x="130" y="117">定义目标与假设</text><text x="365" y="117">预声明判别控制</text>
      <text x="600" y="117">执行与独立重放</text><text x="835" y="117">检查通过与失败</text>
      <text x="1070" y="117">结论与证据归档</text>
    </g>
    <g fill="#526675" font-size="16">
      <text x="130" y="151">态与可观测量匹配</text><text x="365" y="151">固定条件 门限 预算</text>
      <text x="600" y="151">完整算符 符号 身份</text><text x="835" y="151">数值与物理分别判断</text>
      <text x="1070" y="151">来源与适用范围</text>
    </g>
    <rect x="350" y="237" width="500" height="70" rx="12" fill="#e4edf3" stroke="#b8cbd7"/>
    <text x="600" y="266" font-size="19" fill="#153d57">失败保留并选择下一项干预</text>
    <text x="600" y="291" font-size="15" fill="#526675">证据不足时保持未收敛或未认证状态</text>
  </g>
  <g fill="none" stroke="#50748e" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M232 130 H260"/><path d="M467 130 H495"/><path d="M702 130 H730"/><path d="M937 130 H965"/>
    <path d="M835 182 V220 H710 V233"/><path d="M350 270 H130 V184"/>
